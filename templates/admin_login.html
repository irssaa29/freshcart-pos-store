<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - FreshCart</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md w-96 border border-gray-200">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">🔐 Admin Login</h2>
        
        <form action="/admin/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Username</label>
                <input type="text" name="username" required class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Password</label>
                <input type="password" name="password" required class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg transition text-sm shadow-sm">
                Login to Dashboard
            </button>
        </form>
        <div class="text-center mt-4">
            <a href="/" class="text-xs text-gray-500 hover:underline">← Back to Storefront</a>
        </div>
    </div>
</body>
</html>
